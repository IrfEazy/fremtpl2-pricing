seed: 20260101
paths:
  raw: data/raw
  processed: data/processed
  results: results
  reports: reports
download:
  timeout_seconds: 120
  # {id} is the OpenML dataset id; file URLs come from the description it returns.
  description_url: "https://www.openml.org/api/v1/json/data/{id}"
  datasets:
    - key: freq
      openml_id: 41214
      expected_name: freMTPL2freq
      expected_version: "1"
      int_columns: [IDpol]
    - key: sev
      openml_id: 41215
      expected_name: freMTPL2sev
      expected_version: "1"
      int_columns: [IDpol]

# Rating factors: the grouping key for the leakage check and the grouped split (excludes IDpol,
# Exposure, ClaimNb). Pre-registered (PM-1) before the audit was run.
rating_factors: [Area, VehPower, VehAge, DrivAge, BonusMalus, VehBrand, VehGas, Density, Region]

audit:
  exposure_small_thresholds: [0.00274, 0.01, 0.02, 0.05]  # ~1 day, then fractions of a year
  exposure_quantiles: [0.001, 0.005, 0.01, 0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.99, 0.999]
  exposure_bands: [0.0027397260273972603, 0.05, 1.0]  # upper edges: e<=1/365, (1/365,0.05], (0.05,1], then raw e>1
  claim_nb_extreme_above: 4        # recorded ClaimNb values above this are listed as extreme
  high_count_n_above: 5            # policies with N_i (matched severity rows) above this are re-audited
  amount_quantiles: [0.5, 0.75, 0.9, 0.95, 0.99, 0.995, 0.999]
  top_n: 10
  large_loss_candidates: [25000, 50000, 100000, 200000, 500000, 1000000]  # matched claims only
  cap_table: [50000, 100000, 200000, null]  # per-claim caps in the cap table; null = uncapped
  idpol_band_edges: [24500, 100000, 1000000, 3000000]  # upper edges of IDpol bands (<= edge); a last open band follows
  discrepancy_numeric_bins: 5      # quantile bins for numeric rating factors in the discrepancy table
  small_amount_threshold: 100      # ClaimAmount rows below this are counted
  group_size_bins: [1, 2, 3, 4, 5, 10]  # lower edges of the group-size bins; the last bin is open-ended
  epsilon: 1.0e-12                 # guard against division by zero in ratios
  # External figures from the CASdatasets documentation (https://dutangc.github.io/CASdatasets/reference/freMTPL.html),
  # an external claim compared with, not asserted about, the files used here.
  external_reference:
    source: CASdatasets documentation
    policies: 677991
    severity_rows: 26444

# Cleaning rules and targets, applied by one function (fremtpl2_pricing.clean.clean) to the full
# dataset before splitting. Rules were fixed by the human decision of 2026-11-07 (post-audit,
# pre-model amendments, reports/data_audit.md section 8) after the first audit.
clean:
  duplicate_idpol: error           # error | keep (audit measured 0 duplicates)
  exposure_cap: 1.0                # cap Exposure at this many years; null disables (raw exposure)
  exposure_min: null               # drop policies with Exposure below this; null = keep all. e <= 0 / non-finite is always quarantined
  claim_nb:
    max: null                      # no ClaimNb clipping in the primary rules; a number enables
    action: cap                    # cap | exclude (policy dropped)
  high_count:
    exclude_n_above: null          # drop whole policies with N_i above this (all targets alike); null = keep
  sev_without_policy: drop         # severity rows whose IDpol is not in freq: drop (written to the orphan ledger)
  sev_consistency:                 # per category: flag (keep, mark in sev_status) | drop (policy)
    claims_without_sev: flag       # ClaimNb > 0 but no severity rows
    sev_without_claims: flag       # severity rows but ClaimNb = 0
    count_mismatch: flag           # both > 0 but counts differ
  large_loss:
    cap: 100000                    # per-claim cap applied before aggregation; null = uncapped
  epsilon: 1.0e-12                 # guard against division by zero in ratios
  # One policy-level target table (fremtpl2_pricing.targets): N = matched severity rows,
  # S = sum of amounts, S_cap = sum of per-claim capped amounts, excess = S - S_cap.
  targets:
    frequency_count: sev_rows      # sev_rows (b: N, primary) | claim_nb (a: recorded ClaimNb, sensitivity)
  # Training-only flat annual loading of the excess over the cap:
  # sum(train excess) / sum(train exposure), orphans excluded. none | flat_per_exposure_year
  excess_loading:
    mode: flat_per_exposure_year
  # Pre-registered sensitivities (declared before any model is run): rule overrides merged into
  # the primary rules, selectable by name (clean.clean_sensitivity). The split stays frozen.
  sensitivities:
    exclude_high_count: {high_count: {exclude_n_above: 5}}
    frequency_recorded_claim_nb: {targets: {frequency_count: claim_nb}}
    cap_50000: {large_loss: {cap: 50000}}
    cap_200000: {large_loss: {cap: 200000}}
    cap_uncapped: {large_loss: {cap: null}}
    raw_exposure: {exposure_cap: null}
    exclude_short_records_1day: {exposure_min: 0.00274}
    exclude_short_records_0_05: {exposure_min: 0.05}

split:
  primary: grouped                 # grouped | random
  test_folds: 5                    # test = one of this many folds (20% of policies)
  test_fold: 0
  cv_folds: 5                      # CV folds inside train

# Pricing feature engineering for the GLMs (fremtpl2_pricing.features). The definitions are fixed
# before any model is run; only the level sets and reference levels are learned, from the fitting
# rows alone. Exposure (capped by clean) is used for rare-level thresholds and reference choice only.
features:
  definitions:
    DrivAge: {kind: band, lower_edges: [18, 21, 26, 31, 41, 51, 61, 71, 81]}  # last band open; values below the first edge join the first band; bands without fitting exposure are dropped (a value in one raises)
    VehAge: {kind: band, lower_edges: [0, 1, 3, 6, 11, 16]}                   # last band open
    BonusMalus: {kind: numeric_cap, cap: 150}                                 # numeric, min(BonusMalus, cap)
    VehPower: {kind: categorical, cap: 12}                                    # cap at 12, then treated as categorical
    Density: {kind: log}                                                      # natural log; Density <= 0 raises (data minimum is 1)
    Area: {kind: categorical}
    VehGas: {kind: categorical}
    VehBrand: {kind: categorical, group_rare: true}                           # rare levels are merged into other_label; unseen levels map to it (raise if none was created)
    Region: {kind: categorical, group_rare: true}
  rare_levels:
    min_exposure_years: 1500       # a level with less exposure in the fitting data is rare (data-driven)
    other_label: OTHER             # label of the merged level; created only if a rare level was grouped in the fitting data
  reference_level: max_exposure    # reference = level with the largest exposure in the fitting data (never the other label); stored as the first category. Unseen levels of Area/VehGas/VehPower raise
  feature_sets:
    full: [Area, VehPower, VehAge, DrivAge, BonusMalus, VehBrand, VehGas, Density, Region]
    bonus_malus_only: [BonusMalus]  # one-variable baseline

# Milestone 2: GLM cross-validation on the TRAIN set only (fremtpl2_pricing.train). The test set is
# never loaded into a fit, a preprocessing step or a metric. Decisions fixed before any model run.
models:
  glm:
    robust_se: true                # robust (sandwich) covariance in the coefficient tables; false = model-based
    ci_level: 0.95                 # level of the relativity confidence intervals
    solver:                        # glum IRLS settings of every fit; a fit that warns of non-convergence is recorded in cv_glm.json
      max_iter: 1000
      gradient_tol: 1.0e-7   # tightened from 1e-5: the CV frequency fits stopped one IRLS step early (solver check, rel. prediction 1.6e-4 > 1e-4)
      by_family:             # per-family overrides of the settings above
        tweedie:
          gradient_tol: 1.0e-5   # at 1e-6 and tighter the p=1.5 inner fit (outer folds 1 and 2 share this fit) reaches its optimum in 5 IRLS steps but the line search then fails on rounding noise (82-181 iterations, "not converged"); weight normalisation and larger max_iter do not help; the estimates are identical to 1e-8
    solver_check:                  # real-data accuracy check: the final full-train models, and per outer fold the CV Tweedie (selected power and its grid neighbours), frequency and severity fits, are refitted with these glum settings
      max_iter: 1000
      gradient_tol: 1.0e-8
      max_rel_prediction_diff: 1.0e-4   # fail the run if any exceeds: max |mu_cfg - mu_tight| / mu_tight
      max_rel_deviance_diff: 1.0e-8     # |D_cfg - D_tight| / D_tight on the fitting rows
      max_coef_diff: 1.0e-3             # max |beta_cfg - beta_tight| over intercept and coefficients
      max_rel_pure_premium_diff: 2.0e-4 # CV: max |pp_cfg - pp_tight| / pp_tight of the out-of-fold freq x sev pure premium per policy (= the two component limits combined); absolute differences and the prediction quantile of the maximum are recorded
      max_loglik_diff_rel_change: 0.01  # CV: the selected-minus-neighbour (grid neighbours of the selected power) held-out log-likelihood difference keeps its sign and changes by less than this fraction when refitted tightly (per fold and in total)
  cap_reconciliation_rtol: 1.0e-9  # claim-row S_cap total vs policy-level S_cap total must agree within this relative tolerance, else the run raises
  severity_features:
    min_claims: 100                # severity map: derived from the policy map of the same fitting part; a level with fewer claims is merged (see features.fit_severity)
    ordinal: [DrivAge, VehAge, VehPower]  # merged into the adjacent level with more claims (ties toward the reference); all other features are nominal (merged into OTHER, then the reference)
  tweedie:
    power_grid: [1.1, 1.2, 1.3, 1.4, 1.5, 1.6, 1.7, 1.8, 1.9]
    selection_loss: tweedie_loglik  # held-out Tweedie log-likelihood of S_cap / Exposure (prior weight = exposure), dispersion by maximum likelihood on the fitting part only; the exposure-weighted Poisson deviance per power is kept as a labelled diagnostic
    dispersion_log_range: 3.0      # the dispersion search covers the Pearson estimate times exp(+-range); an extension adds this much on the side of the bound
    dispersion_edge_rtol: 0.01     # an optimum within this fraction of the half-width (dispersion_log_range) of a bound triggers an expansion
    dispersion_max_expansions: 5   # expansions allowed per dispersion fit; still on the bound afterwards raises
    reference_power: 1.5           # fixed power: common Tweedie deviance used to compare models, and the fixed-power Tweedie sensitivity `tweedie_ref` in the pure premium comparison
    fixed_power_sensitivities: [1.3, 1.7]  # further fixed powers in the out-of-fold pure premium comparison (labelled `tweedie_fixed_<p>`); the common deviance stays at reference_power
  evaluation:
    n_bins: 10                     # lift / double-lift / calibration bins of ~equal exposure
    calibration_factors:
      BonusMalus: {kind: edges, lower_edges: [50, 60, 70, 80, 100, 125]}  # last band open; values below the first edge join the first band
      DrivAge: {kind: feature_band}  # the bands of features.definitions
      VehAge: {kind: feature_band}
      Region: {kind: raw}            # raw levels
  group_summary:                   # train-only description of the rating-profile groups (the bootstrap unit), per CV fold and overall
    size_quantiles: [0.5, 0.9, 0.99]
    top_share: 0.01                # exposure share of the largest groups (by policy count) making up this fraction of the groups
  bootstrap:                       # recorded only: applied to the test set in milestone 3, not here
    applied: false
    unit: group                    # rating-profile groups (primary), paired across models
    sensitivity_unit: policy
    replicates: 1000
    seed: 20260102
    level: 0.95
  sensitivities:                   # fremtpl2 sensitivities: outer CV only, train set, Tweedie power fixed at final.power_cv.power of outputs.cv_json
    names: all                     # all | list of names declared in clean.sensitivities (primary is always run as the baseline)
    outputs:                       # file names under paths.results / paths.reports
      json: cv_sensitivities.json
      report: glm_sensitivities.md
  parallel:
    n_jobs: 6                      # worker processes for the independent CV fits (results do not depend on it)
  outputs:                         # file names under paths.results / paths.reports
    cv_json: cv_glm.json
    relativities_frequency: glm_relativities_frequency.csv
    relativities_severity: glm_relativities_severity.csv
    relativities_tweedie: glm_relativities_tweedie.csv
    feature_map: feature_map.json
    models: glm_models.json
    report: glm_cv.md
    staging_dir: glm_staging       # under paths.processed: artifacts are written here and promoted to results/reports only if every gate passes
    failure_diagnostic: glm_train_FAILED.json  # under paths.processed (git-ignored): written instead of the artifacts when a gate fails
