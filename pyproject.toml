[project]
name = "fremtpl2-pricing"
version = "0.1.0"
description = "Reproducible motor insurance pricing study on freMTPL2 (frequency, severity, pure premium)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "glum>=3.4.1",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy",
    "pandas",
    "pyarrow",
    "pyyaml",
    "requests",
    "scikit-learn",
    "scipy>=1.17.1",
]

[project.scripts]
fremtpl2 = "fremtpl2_pricing.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "statsmodels>=0.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fremtpl2_pricing"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/fremtpl2_pricing/audit.py" = ["E501"]  # report prose templates
"tests/test_interpret_report.py" = ["F811"]  # fixtures imported from test_freeze_evaluate
