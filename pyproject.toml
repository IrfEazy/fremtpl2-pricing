[project]
name = "fremtpl2-pricing"
version = "0.1.0"
description = "Reproducible motor insurance pricing study on freMTPL2 (frequency, severity, pure premium)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "pyyaml",
    "requests",
    "scikit-learn",
]

[project.scripts]
fremtpl2 = "fremtpl2_pricing.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fremtpl2_pricing"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
